<div class="checkin-container">
  <div class="card">
    <div class="card-header">
      <h2><i class="fas fa-key"></i> Registro de Check-In</h2>
      <span class="room-badge">Habitación #{{ idHabitacion }}</span>
    </div>

    <div class="card-body">
      <div class="section">
        <h3>Datos del Huésped</h3>
        <div class="search-group">
          <div class="input-field">
            <label>DNI del Huésped</label>
            <div class="input-with-button">
              <input type="text" [(ngModel)]="huesped.dni" placeholder="Ej. 72654321" maxlength="8">
              <button (click)="buscarDni()" [disabled]="buscandoDni" class="btn-search">
                <span *ngIf="!buscandoDni">🔍 Buscar</span>
                <span *ngIf="buscandoDni">...</span>
              </button>
            </div>
          </div>
        </div>

        <div class="grid-form">
          <div class="input-field">
            <label>Nombres</label>
            <input type="text" [(ngModel)]="huesped.nombres">
          </div>
          <div class="input-field">
            <label>Apellidos</label>
            <input type="text" [(ngModel)]="huesped.apellidos">
          </div>
          <div class="input-field">
            <label>Teléfono</label>
            <input type="text" [(ngModel)]="huesped.telefono">
          </div>
          <div class="input-field">
            <label>Correo Electrónico (Opcional)</label>
            <input type="email" [(ngModel)]="huesped.email" placeholder="Para enviar comprobante">
          </div>
        </div>
      </div>

      <div class="section mt-20">
        <h3>Detalles de la Operación</h3>
        <div class="grid-form">
          <div class="input-field">
            <label>Adelanto (S/.)</label>
            <input type="number" [(ngModel)]="operacion.adelanto" class="highlight-input">
          </div>
          <div class="input-field full-width">
            <label>Observaciones / Notas especiales</label>
            <textarea [(ngModel)]="operacion.observacion" rows="2"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="card-footer">
      <button class="btn-secondary" (click)="regresar()">Cancelar</button>
      <button class="btn-primary" (click)="confirmarCheckIn()">
        <i class="fas fa-check"></i> Confirmar Ingreso
      </button>
    </div>
  </div>
</div>
